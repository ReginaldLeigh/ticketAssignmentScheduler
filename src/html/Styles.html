<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2a37;
    --ink-soft: #4b5869;
    --paper: #fbfcfd;
    --hole: #eef2f6;
    --line: #cdd5df;
    --post: #2456a6;
    --post-deep: #183d78;
    --tag: #f2e3b3;
    --tag-edge: #d9c27f;
    --warn: #b4232c;
    --ok: #2f7d4f;
    --focus: 0 0 0 3px rgba(36, 86, 166, .35);
    --r-sm: 4px;
    --r-md: 8px;
    /* Always the light palette: without this, dark-mode browsers and viewers draw dialogs,
       dropdowns and date pickers black while buttons keep white backgrounds (unreadable text). */
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 15px/1.5 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 700; }
  h1 { font-size: 1.15rem; letter-spacing: -.01em; }
  h2 { font-size: 1.5rem; letter-spacing: -.015em; }
  h3 { font-size: 1.05rem; }
  p { margin: 0 0 .75rem; max-width: 72ch; }
  a { color: var(--post); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--focus); }

  /* ── Shell ─────────────────────────────────────────── */
  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; background: #f3f6f9; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand svg { flex: none; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; color: var(--ink-soft); font-weight: 500; }
  .nav button:hover { background: var(--hole); color: var(--ink); }
  .nav button[aria-current="page"] { background: #fff; color: var(--post-deep); font-weight: 600; box-shadow: inset 3px 0 0 var(--post); }
  .who { margin-top: auto; font-size: .85rem; color: var(--ink-soft); padding: 0 6px; word-break: break-all; }
  .who strong { display: block; color: var(--ink); font-weight: 600; }
  main { padding: 28px 32px 64px; min-width: 0; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head .sub { color: var(--ink-soft); margin-top: 4px; }
  .running { display: inline-flex; align-items: center; gap: 8px; background: #e6eefb; color: var(--post-deep); border-radius: 999px; padding: 4px 12px; font-size: .85rem; font-weight: 500; }
  .running::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--post); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* ── Controls ──────────────────────────────────────── */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: var(--r-sm); padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: var(--ink-soft); }
  .btn.primary { background: var(--post); border-color: var(--post); color: #fff; }
  .btn.primary:hover { background: var(--post-deep); }
  .btn.danger { color: var(--warn); }
  .btn.small { padding: 3px 9px; font-size: .85rem; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .icon-btn { border: 0; background: none; cursor: pointer; padding: 2px 6px; border-radius: var(--r-sm); color: var(--ink-soft); line-height: 1; }
  .icon-btn:hover { background: rgba(31, 42, 55, .08); color: var(--ink); }
  input[type=text], input[type=email], input[type=date], input[type=number], select, textarea {
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 9px; background: #fff; color: var(--ink); min-width: 0; }
  textarea { width: 100%; min-height: 70px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--ink-soft); font-weight: 500; }
  label.check { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--ink-soft); }
  .small { font-size: .85rem; }
  .stack > * + * { margin-top: 18px; }

  /* ── The rota board (the memorable bit) ────────────── */
  .board-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: #fff; }
  table.board { border-collapse: separate; border-spacing: 6px; width: 100%; min-width: 960px; table-layout: fixed; }
  .board col.mbcol { width: 170px; }
  .board th { font-weight: 600; text-align: left; font-size: .9rem; padding: 6px 8px; }
  .board thead th { color: var(--ink-soft); font-weight: 500; }
  .board thead th .d { display: block; color: var(--ink); font-weight: 700; font-size: 1.05rem; }
  .board thead th.today .d { color: var(--post); }
  .board tbody th { vertical-align: top; padding-top: 12px; overflow-wrap: anywhere; }
  .board tbody th .desc { display: block; font-weight: 400; color: var(--ink-soft); font-size: .8rem; }
  .hole { background: var(--hole); border-radius: var(--r-sm); min-height: 74px; vertical-align: top; padding: 6px;
    box-shadow: inset 0 2px 0 rgba(31, 42, 55, .07); transition: background .15s; }
  .hole.today { background: #e3ebf7; }
  .hole.drop { background: #d4e2f8; outline: 2px dashed var(--post); outline-offset: -2px; }
  .tags { display: flex; flex-direction: column; gap: 4px; }
  .tag { position: relative; display: flex; align-items: center; gap: 4px; background: var(--tag); border: 1px solid var(--tag-edge);
    border-radius: 3px 10px 10px 3px; padding: 3px 6px 3px 14px; font-size: .85rem; font-weight: 600; line-height: 1.25; }
  .tag::before { content: ''; position: absolute; left: 5px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%;
    background: var(--paper); box-shadow: inset 0 0 0 1px var(--tag-edge); }
  .tag .nm { flex: 1; min-width: 0; overflow-wrap: break-word; }
  .tag .acts { display: inline-flex; flex: none; }
  .tag .flag { display: block; font-size: .72rem; font-weight: 500; color: var(--warn); }
  .tag[draggable=true] { cursor: grab; }
  .tag.dim { opacity: .28; }
  .tag.hi { box-shadow: 0 0 0 2px var(--post); }
  .tag .icon-btn { padding: 0 3px; font-size: .9rem; }
  .tag.unmapped { background: #fbf6e4; border-style: dashed; color: var(--ink-soft); font-weight: 500; }
  @media (hover: hover) {
    /* On pointer devices the actions overlay the tag on hover/focus, so names get the full width. */
    .tags .tag .acts { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); background: var(--tag);
      border-radius: 8px; padding-left: 2px; opacity: 0; pointer-events: none; transition: opacity .12s; }
    .tags .tag.unmapped .acts { background: #fbf6e4; }
    .tags .tag:hover .acts, .tags .tag:focus-within .acts { opacity: 1; pointer-events: auto; }
  }
  .add-slot { margin-top: 4px; }
  .add-slot select { width: 100%; font-size: .85rem; padding: 3px 6px; }
  .add-btn { width: 100%; border: 1px dashed var(--line); background: transparent; border-radius: 3px; color: var(--ink-soft); font-size: .8rem; padding: 2px; cursor: pointer; }
  .add-btn:hover { border-color: var(--post); color: var(--post); background: #fff; }
  .legend { display: flex; gap: 14px; align-items: center; color: var(--ink-soft); font-size: .85rem; margin-top: 10px; flex-wrap: wrap; }

  /* ── Panels & tables ───────────────────────────────── */
  .panel { border: 1px solid var(--line); border-radius: var(--r-md); background: #fff; padding: 18px 20px; }
  .panel > h3 { margin-bottom: 10px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  table.data { border-collapse: collapse; width: 100%; font-size: .9rem; }
  .data th { text-align: left; font-weight: 600; color: var(--ink-soft); border-bottom: 1px solid var(--line); padding: 8px 10px; white-space: nowrap; }
  .data td { border-bottom: 1px solid #e6ebf1; padding: 8px 10px; vertical-align: top; }
  .data tr.inactive td { color: var(--ink-soft); }
  .table-scroll { overflow-x: auto; }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 600; background: var(--hole); color: var(--ink-soft); }
  .pill.ok { background: #e1f1e7; color: var(--ok); }
  .pill.bad { background: #f8e1e2; color: var(--warn); }
  .pill.info { background: #e6eefb; color: var(--post-deep); }
  .pill.follow { background: var(--tag); color: #6b5413; }

  /* ── Mailboxes & rules ─────────────────────────────── */
  .mb { border: 1px solid var(--line); border-radius: var(--r-md); background: #fff; }
  .mb + .mb { margin-top: 10px; }
  .mb-head { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
  .mb-order { display: flex; flex-direction: column; }
  .mb-pos { width: 26px; height: 26px; border-radius: 50%; background: var(--hole); display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; }
  .mb-title { flex: 1; min-width: 0; }
  .mb-body { border-top: 1px solid #e6ebf1; padding: 10px 16px 14px 54px; }
  .rule { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
  .rule + .rule { border-top: 1px dashed #e0e6ed; }
  .rule .cond { flex: 1; }
  .cond code { background: var(--hole); border-radius: 3px; padding: 0 5px; font-family: inherit; font-weight: 600; }
  .builder { background: #f6f8fb; border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; margin-top: 8px; }
  .builder .crow { display: grid; grid-template-columns: 1.2fr 1fr 1.6fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .builder .crow .pair { display: flex; gap: 6px; align-items: center; }
  .builder .crow .pair input { flex: 1; width: 0; }
  .and { color: var(--ink-soft); font-size: .8rem; margin: -2px 0 6px; }

  /* ── Feedback ──────────────────────────────────────── */
  .notice { border-left: 4px solid var(--post); background: #eef3fb; padding: 12px 16px; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
  .notice.bad { border-color: var(--warn); background: #fbeeee; }
  .notice.good { border-color: var(--ok); background: #edf6f0; }
  .notice ul { margin: 6px 0 0; padding-left: 20px; }
  #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: 380px; }
  .toast { background: var(--ink); color: #fff; padding: 10px 14px; border-radius: var(--r-md); box-shadow: 0 6px 24px rgba(31, 42, 55, .25); font-size: .9rem; }
  .toast.bad { background: var(--warn); }
  .toast.sticky { display: flex; gap: 10px; align-items: flex-start; }
  .toast.sticky span { flex: 1; }
  .toast-close { background: none; border: 0; color: inherit; font-size: 1.2rem; line-height: 1; cursor: pointer; padding: 0 2px; opacity: .8; }
  .toast-close:hover { opacity: 1; }
  .team-name { font-weight: 700; color: var(--post-deep); font-size: .95rem; margin-bottom: 4px; }
  .day-picks { display: flex; gap: 4px; flex-wrap: wrap; }
  .day-picks label { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 8px; font-size: .85rem; cursor: pointer; background: #fff; }
  .day-picks input:checked + span { font-weight: 600; color: var(--post-deep); }
  .preview { margin-top: 12px; min-height: 22px; font-size: .9rem; }
  .shortcut-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
  .saving { font-size: .85rem; color: var(--ink-soft); min-width: 70px; }
  dialog { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-md); padding: 22px; max-width: 520px; width: calc(100% - 32px); box-shadow: 0 18px 50px rgba(31, 42, 55, .3); }
  dialog::backdrop { background: rgba(31, 42, 55, .35); }
  dialog h3 { margin-bottom: 8px; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  pre.json { background: var(--hole); padding: 10px; border-radius: var(--r-sm); font-size: .8rem; overflow: auto; max-height: 220px; white-space: pre-wrap; }
  .empty { padding: 28px; text-align: center; color: var(--ink-soft); }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; gap: 10px; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .who { margin-top: 0; }
    main { padding: 20px 14px 48px; }
    .builder .crow { grid-template-columns: 1fr; }
    .mb-body { padding-left: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
